[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visilens"
version = "0.7.0"
description = "Cross-platform visual duplicate image finder"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Pillow>=10.0", "ImageHash>=4.3", "numpy>=1.26", "PySide6>=6.6", "Send2Trash>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
visilens = "visilens.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
visilens = ["assets/*.b64"]
