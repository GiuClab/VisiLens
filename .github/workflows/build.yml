name: Build VisiLens for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "pyproject.toml"
      - "run_visilens.py"
      - "src/**"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name VisiLens run_visilens.py
      - name: Archive Windows package
        shell: pwsh
        run: Compress-Archive -Path dist/VisiLens -DestinationPath VisiLens-Windows.zip
      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: VisiLens-Windows
          path: VisiLens-Windows.zip
          if-no-files-found: error
          retention-days: 30
